name: Enforce branch policy

on:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  source:
    name: develop to master only
    runs-on: ubuntu-latest
    steps:
      - name: Require an allowed source branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_REPO" != "$REPOSITORY" ]]; then
            echo "The PR base repository does not match ${REPOSITORY}."
            exit 1
          fi

          case "$BASE_REF" in
            develop)
              case "$HEAD_REF" in
                feature/?*|fix/?*|docs/?*|chore/?*|refactor/?*|test/?*|backport/?*) ;;
                *)
                  echo "PRs to develop require one of: feature/, fix/, docs/, chore/, refactor/, test/, backport/."
                  exit 1
                  ;;
              esac
              ;;
            master)
              if [[ "$HEAD_REPO" != "$REPOSITORY" ]]; then
                echo "PRs to master must originate in the same repository."
                exit 1
              fi
              case "$HEAD_REF" in
                release/?*|hotfix/?*) ;;
                *)
                  echo "PRs to master require a release/ or hotfix/ branch."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported base branch: ${BASE_REF}."
              exit 1
              ;;
          esac

  version:
    name: stable version increases
    if: github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Require a strictly newer stable SemVer
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          read_version() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/plugins/asgard/.codex-plugin/plugin.json?ref=$1" --jq .content | base64 --decode | jq -er .version
          }
          candidate="$(read_version "$HEAD_SHA")"
          current="$(read_version "$BASE_SHA")"
          python -c 'import re,sys; p=re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"); a,b=sys.argv[1:]; assert p.fullmatch(a), "Release versions must be stable SemVer (no prerelease/build metadata)"; assert p.fullmatch(b), "Current master version is not stable SemVer"; assert tuple(map(int,a.split("."))) > tuple(map(int,b.split("."))), f"Candidate {a} must be greater than master {b}"' "$candidate" "$current"
