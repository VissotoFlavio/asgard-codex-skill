name: Publish release

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and create GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      published-sha: ${{ steps.publish.outputs.published-sha }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Publish the merged candidate
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/plugins/asgard/.codex-plugin/plugin.json?ref=${MERGE_SHA}" --jq .content | base64 --decode)"
          version="$(jq -er .version <<< "$content")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release versions must be stable Semantic Versioning values."
            exit 1
          fi

          tag="v${version}"
          echo "published-sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          tag_endpoint="repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"
          tag_probe="$(mktemp)"
          trap 'rm -f "$tag_probe"' EXIT
          if gh api --include --silent "$tag_endpoint" >"$tag_probe" 2>&1; then
            tag_status="$(awk '/^HTTP\// { status=$2 } END { print status }' "$tag_probe" | tr -d '\r')"
          else
            tag_status="$(awk '/^HTTP\// { status=$2 } END { print status }' "$tag_probe" | tr -d '\r')"
            if [[ "$tag_status" != "404" ]]; then
              echo "Unable to inspect ${tag}; GitHub API status: ${tag_status:-unknown}."
              sed -n '1,20p' "$tag_probe"
              exit 1
            fi
          fi

          tag_object=""
          if [[ "$tag_status" == "200" ]]; then
            tag_object="$(gh api "$tag_endpoint" --jq '[.object.type,.object.sha] | @tsv')"
          elif [[ "$tag_status" != "404" ]]; then
            echo "Unexpected GitHub API status while inspecting ${tag}: ${tag_status:-unknown}."
            exit 1
          fi
          existing_sha=""
          if [[ -n "$tag_object" ]]; then
            read -r object_type existing_sha <<< "$tag_object"
            while [[ "$object_type" == "tag" ]]; do
              tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing_sha}" --jq '[.object.type,.object.sha] | @tsv')"
              read -r object_type existing_sha <<< "$tag_object"
            done
            if [[ "$object_type" != "commit" ]]; then
              echo "${tag} resolves to unsupported Git object type ${object_type}."
              exit 1
            fi
          fi
          if [[ -n "$existing_sha" && "$existing_sha" != "$MERGE_SHA" ]]; then
            echo "${tag} already points to ${existing_sha}, not merged commit ${MERGE_SHA}."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" --target "$MERGE_SHA" --generate-notes --title "Asgard ${tag}"

  create-backport:
    name: Open backport to develop
    needs: release
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Require backport token
        env:
          BACKPORT_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$BACKPORT_TOKEN" ]]; then
            echo "BACKPORT_TOKEN is required to open a PR that triggers CI."
            exit 1
          fi

      - name: Open master backport to develop
        id: backport
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
          PUBLISHED_SHA: ${{ needs.release.outputs.published-sha }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY}"
          owner="${repository%%/*}"
          master_sha="$(gh api "repos/${repository}/git/ref/heads/master" --jq .object.sha)"
          if [[ "$master_sha" != "$PUBLISHED_SHA" ]]; then
            echo "master points to ${master_sha}, not published commit ${PUBLISHED_SHA}."
            exit 1
          fi
          existing_url="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/${repository}/pulls?state=open&base=develop&head=${owner}%3Amaster&per_page=100" \
            --jq '.[0].html_url // empty')"
          if [[ -n "$existing_url" ]]; then
            echo "Backport PR already exists: ${existing_url}"
            exit 0
          fi
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          {
            echo "Backports \`master\` after publishing version \`${VERSION}\` to \`develop\`."
            echo
            echo "- Stable tag: \`v${VERSION}\`"
            echo "- Source commit: \`${PUBLISHED_SHA}\`"
            echo "- Publishing workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$body_file"
          pr_url="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${repository}/pulls" \
            -f title="chore: backport v${VERSION} to develop" \
            -f head='master' \
            -f base='develop' \
            -F body=@"$body_file" \
            --jq .html_url)"
          echo "Opened backport PR: ${pr_url}"
