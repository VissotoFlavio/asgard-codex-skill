name: Publish release

on:
  pull_request_target:
    branches: [master]
    types: [closed]

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and create GitHub Release
    permissions:
      contents: write
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      published-sha: ${{ steps.publish.outputs.published-sha }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Publish the merged candidate
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/plugins/asgard/.codex-plugin/plugin.json?ref=${MERGE_SHA}" --jq .content | base64 --decode)"
          version="$(jq -er .version <<< "$content")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release versions must be stable Semantic Versioning values."
            exit 1
          fi

          tag="v${version}"
          echo "published-sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          tag_endpoint="repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"
          tag_probe="$(mktemp)"
          trap 'rm -f "$tag_probe"' EXIT
          if gh api --include --silent "$tag_endpoint" >"$tag_probe" 2>&1; then
            tag_status="$(awk '/^HTTP\// { status=$2 } END { print status }' "$tag_probe" | tr -d '\r')"
          else
            tag_status="$(awk '/^HTTP\// { status=$2 } END { print status }' "$tag_probe" | tr -d '\r')"
            if [[ "$tag_status" != "404" ]]; then
              echo "Unable to inspect ${tag}; GitHub API status: ${tag_status:-unknown}."
              sed -n '1,20p' "$tag_probe"
              exit 1
            fi
          fi

          tag_object=""
          if [[ "$tag_status" == "200" ]]; then
            tag_object="$(gh api "$tag_endpoint" --jq '[.object.type,.object.sha] | @tsv')"
          elif [[ "$tag_status" != "404" ]]; then
            echo "Unexpected GitHub API status while inspecting ${tag}: ${tag_status:-unknown}."
            exit 1
          fi
          existing_sha=""
          if [[ -n "$tag_object" ]]; then
            read -r object_type existing_sha <<< "$tag_object"
            while [[ "$object_type" == "tag" ]]; do
              tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing_sha}" --jq '[.object.type,.object.sha] | @tsv')"
              read -r object_type existing_sha <<< "$tag_object"
            done
            if [[ "$object_type" != "commit" ]]; then
              echo "${tag} resolves to unsupported Git object type ${object_type}."
              exit 1
            fi
          fi
          if [[ -n "$existing_sha" && "$existing_sha" != "$MERGE_SHA" ]]; then
            echo "${tag} already points to ${existing_sha}, not merged commit ${MERGE_SHA}."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" --target "$MERGE_SHA" --generate-notes --title "Asgard ${tag}"

  create-backport:
    name: Open backport to develop
    needs: release
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Require backport token
        env:
          BACKPORT_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$BACKPORT_TOKEN" ]]; then
            echo "BACKPORT_TOKEN is required to push a branch and open a PR that triggers CI."
            exit 1
          fi

      - name: Checkout published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.published-sha }}
          fetch-depth: 0
          token: ${{ secrets.BACKPORT_TOKEN }}

      - name: Verify release and select branch
        id: backport
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
          PUBLISHED_SHA: ${{ needs.release.outputs.published-sha }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          tag_sha="$(git rev-list -n 1 "$tag")"
          if [[ "$tag_sha" != "$PUBLISHED_SHA" ]]; then
            echo "${tag} points to ${tag_sha}, not published commit ${PUBLISHED_SHA}."
            exit 1
          fi

          preferred="backport/${VERSION}"
          validate_branch() {
            local candidate="$1"
            local expected_oid="${2:-}"
            git fetch --no-tags --force origin "refs/heads/${candidate}:refs/remotes/origin/${candidate}" >/dev/null 2>&1 || return 1
            branch_sha="$(git rev-parse "refs/remotes/origin/${candidate}")"
            [[ -z "$expected_oid" || "$branch_sha" == "$expected_oid" ]] || return 1
            read -r -a ancestry <<< "$(git rev-list --parents -n 1 "$branch_sha")"
            [[ "${#ancestry[@]}" -eq 2 && "${ancestry[1]}" == "$PUBLISHED_SHA" ]] || return 1
            git diff --quiet "$PUBLISHED_SHA" "$branch_sha"
          }

          while IFS=$'\t' read -r pr_branch pr_oid pr_repo pr_url; do
            if [[ "$pr_repo" == "$GITHUB_REPOSITORY" ]] && validate_branch "$pr_branch" "$pr_oid"; then
              echo "Backport PR already exists: ${pr_url}"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "branch=${pr_branch}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(gh pr list --state open --base develop --limit 1000 \
            --json headRefName,headRefOid,headRepository,url \
            --jq ".[] | select(.headRefName == \"${preferred}\" or (.headRefName | startswith(\"${preferred}-\"))) | [.headRefName,.headRefOid,.headRepository.nameWithOwner,.url] | @tsv")

          branch=""
          while read -r candidate; do
            if [[ -n "$candidate" ]] && validate_branch "$candidate"; then
              branch="$candidate"
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done < <(git ls-remote --heads origin \
            "refs/heads/${preferred}" "refs/heads/${preferred}-*" |
            awk '{sub("refs/heads/", "", $2); print $2}')

          if [[ -z "$branch" ]]; then
            branch="${preferred}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Backport fallback branch ${branch} already exists and cannot be safely reused."
              exit 1
            fi
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          else
            echo "Reusing verified backport branch ${branch}."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Create and push backport branch
        if: steps.backport.outputs.skip != 'true' && steps.backport.outputs.reuse != 'true'
        env:
          BRANCH: ${{ steps.backport.outputs.branch }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --allow-empty --message "chore: backport v${VERSION} to develop"
          git push --set-upstream origin "$BRANCH"

      - name: Open backport pull request
        if: steps.backport.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.backport.outputs.branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
          PUBLISHED_SHA: ${{ needs.release.outputs.published-sha }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          {
            echo "Backports the published version \`${VERSION}\` to \`develop\`."
            echo
            echo "- Stable tag: \`v${VERSION}\`"
            echo "- Source commit: \`${PUBLISHED_SHA}\`"
            echo "- Publishing workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$body_file"
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: backport v${VERSION} to develop" \
            --body-file "$body_file"
